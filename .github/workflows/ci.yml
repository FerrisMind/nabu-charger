name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  verify:
    name: build, linters, tests, documentation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Formatting
        run: cargo fmt --all --check

      - name: Linters (including pedantic rules, warnings as errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Release build
        run: cargo build --workspace --release

      - name: Tests
        run: cargo test --workspace

      - name: Documentation (without external dependencies)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: No-std core check
        run: cargo build -p charger-core --no-default-features

  kernel-driver:
    name: kernel-mode driver (ARM64, WDK)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and the ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"
          targets: aarch64-pc-windows-msvc

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/kmdf/target
            crates/ln8000-kmdf/target
          key: ${{ runner.os }}-wdk-${{ hashFiles('**/Cargo.lock') }}

      # The image carries no WDK: without it the build stops on
      # `cannot find directory: ...\Include\10.0.26100.0\km\crt`, because only the SDK
      # is installed and `wdk-build` looks for the kernel headers under the same version
      # folder. The versions match docs/HANDOVER.md.
      - name: Install the Windows Driver Kit 10.0.26100
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($id in 'Microsoft.WindowsSDK.10.0.26100', 'Microsoft.WindowsWDK.10.0.26100') {
            Write-Host "winget install --id $id"
            winget install --id $id --exact --silent `
              --accept-source-agreements --accept-package-agreements --disable-interactivity
            # 0 = installed, 0x8A150061 = already installed, 0x8A15002B = no newer version.
            # The gate is the header check below, not this exit code: the WDK setup also
            # adds its Visual Studio integration, and a failure there must not be read
            # as "the headers are missing".
            Write-Host "  exit code: $LASTEXITCODE"
          }
          $crt = 'C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\km\crt'
          if (-not (Test-Path $crt)) { throw "the kernel headers wdk-build looks for are missing: $crt" }
          Write-Host "kernel headers present: $crt"

      # bindgen parses the WDF headers with libclang. The image's LLVM (22.x) mangles
      # them - `attempt to compute 1_usize - 56_usize, which would overflow` - so 17.0.6
      # goes next to it in its own directory and LIBCLANG_PATH points there.
      - name: Install LLVM 17.0.6 for bindgen
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'LLVM-17.0.6-win64.exe'
          Invoke-WebRequest -Uri 'https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/LLVM-17.0.6-win64.exe' -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList '/S', '/D=C:\llvm17' -Wait
          $clang = 'C:\llvm17\bin\clang.exe'
          if (-not (Test-Path $clang)) { throw "clang is not where the installer was told to put it: $clang" }
          & $clang --version | Select-Object -First 1
          "LIBCLANG_PATH=C:\llvm17\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # cargo-wdk test-signs every package it builds, with the certificate it finds in the
      # user store `WDRTestCertStore`; the image is not guaranteed to carry one, and a run
      # without one stops inside the package step with `SignTool Error: File not found`.
      # The release workflow calls the same script with -Trust, because it verifies the
      # signature it makes; nothing here does, so trust is not needed.
      - name: Prepare the test signing certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File .\deploy\prepare-test-cert.ps1 -ClearCachedCertFiles
          if ($LASTEXITCODE -ne 0) { throw "prepare-test-cert.ps1 failed with exit code $LASTEXITCODE" }

      - name: Install cargo-wdk
        run: cargo install cargo-wdk --locked

      # RUSTFLAGS replaces the crate's .cargo/config.toml instead of extending it, so the
      # three flags that file carries - the static CRT, panic=abort and /Brepro - are
      # repeated here on top of the workspace's `-D warnings`.
      - name: Build the SMB driver for ARM64
        working-directory: crates/kmdf
        env:
          RUSTFLAGS: "-D warnings -C target-feature=+crt-static -C panic=abort -C link-arg=/Brepro"
        run: cargo wdk build --target-arch arm64 --profile release

      - name: Build the LN8000 driver for ARM64
        working-directory: crates/ln8000-kmdf
        env:
          RUSTFLAGS: "-D warnings -C target-feature=+crt-static -C panic=abort -C link-arg=/Brepro"
        run: cargo wdk build --target-arch arm64 --profile release
