name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  verify:
    name: build, linters, tests, documentation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Formatting
        run: cargo fmt --all --check

      - name: Linters (including pedantic rules, warnings as errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Release build
        run: cargo build --workspace --release

      - name: Tests
        run: cargo test --workspace

      - name: Documentation (without external dependencies)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: No-std core check
        run: cargo build -p charger-core --no-default-features

  kernel-driver:
    name: kernel-mode driver (ARM64, WDK)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and the ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"
          targets: aarch64-pc-windows-msvc

      - name: Install cargo-wdk
        run: cargo install cargo-wdk --locked

      # Building the kernel part needs the WDK and LLVM 17.x (on 23.x bindgen breaks
      # parsing of the WDF headers). The step does not fail the build until the base
      # GitHub runner image is pinned to the right LLVM version: see docs/HANDOVER.md.
      - name: Build the driver for ARM64
        working-directory: crates/kmdf
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: cargo wdk build --target-arch arm64 --profile release
