[toolchain]
channel = "1.97.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
# Two targets, and both are needed:
#  * x86_64-pc-windows-msvc - the host tools (CLI, tests, benchmarks) run
#    on this Ryzen (amd64) machine and are checked right here;
#  * aarch64-pc-windows-msvc - the target device: the Xiaomi Pad 5 tablet (nabu,
#    Snapdragon 860) running Windows on ARM64. The kernel-mode driver is built
#    for it (see crates/kmdf/.cargo/config.toml).
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
