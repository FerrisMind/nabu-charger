[package]
name = "cli"
description = "Утилита командной строки драйвера зарядки nabu: демонстрация, детекция, симулятор стенда"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["driver", "charger", "cli", "pmic"]
categories = ["hardware-support", "command-line-utilities"]

[[bin]]
name = "nabu-charger"
path = "src/main.rs"

[dependencies]
# Имя зависимости не `core`: иначе clap-derive не находит `core::env` из std.
charger_core = { package = "charger-core", path = "../core", version = "0.1.0" }
host = { workspace = true }
clap = { version = "4.5.40", features = ["derive"] }
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter"] }
serde_json = "1.0.140"

[dev-dependencies]
tempfile = "3.20.0"

[lints]
workspace = true
