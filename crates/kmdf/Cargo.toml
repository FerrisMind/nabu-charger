[package]
name = "kmdf"
description = "Kernel-mode driver (KMDF) for charging the Xiaomi Pad 5: APSD reading and input current limit via \\Device\\RESOURCE_HUB"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-or-later"
publish = false

# The crate is excluded from the workspace: the build requires the WDK,
# LLVM/clang (for bindgen) and cargo-wdk. The regular workspace CI builds only
# the host part.
[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[package.metadata.wdk.driver-model]
driver-type = "KMDF"
kmdf-version-major = 1
target-kmdf-version-minor = 33

[dependencies]
charger_core = { package = "charger-core", path = "../core", default-features = false }
# Public SPB ABI and Resource Hub path: one implementation for both drivers,
# covered by host tests.
spb = { path = "../spb" }
wdk = "0.4.1"
wdk-alloc = "0.4.1"
wdk-panic = "0.4.1"
wdk-sys = "0.5.1"
paste = "1.0.15"

[build-dependencies]
wdk-build = "0.5.1"
anyhow = "1.0.97"

[features]
default = []
nightly = ["wdk/nightly", "wdk-sys/nightly"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
