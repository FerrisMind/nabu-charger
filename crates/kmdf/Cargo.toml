[package]
name = "kmdf"
description = "Драйвер режима ядра (KMDF) для зарядки Xiaomi Pad 5: чтение APSD и лимит входного тока через \\Device\\RESOURCE_HUB"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

# Крейт исключён из воркспейса: сборка требует WDK, LLVM/clang (для bindgen)
# и cargo-wdk. Обычный CI воркспейса собирает только хост-часть.
[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[package.metadata.wdk.driver-model]
driver-type = "KMDF"
kmdf-version-major = 1
target-kmdf-version-minor = 33

[dependencies]
charger_core = { package = "charger-core", path = "../core", default-features = false }
# Публичный ABI SPB и путь Resource Hub: одна реализация на оба драйвера,
# покрыта тестами на хосте.
spb = { path = "../spb" }
wdk = "0.4.1"
wdk-alloc = "0.4.1"
wdk-panic = "0.4.1"
wdk-sys = "0.5.1"
paste = "1.0.15"

[build-dependencies]
wdk-build = "0.5.1"
anyhow = "1.0.97"

[features]
default = []
nightly = ["wdk/nightly", "wdk-sys/nightly"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
