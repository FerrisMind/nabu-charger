# The kernel-mode driver is built ONLY for ARM64: the target device is a
# Xiaomi Pad 5 tablet (nabu, Snapdragon 860) under Windows on ARM64.
# The host machine here is amd64, so without this file cargo would build for
# x86_64 by default and the driver would not load on the tablet.
[build]
target = "aarch64-pc-windows-msvc"
# The kernel links against the static CRT: this is a WDK requirement, and
# `wdk-build` refuses to build the driver without it (`Error: StaticCrtNotEnabled`).
# `panic=abort` is the mandatory mode for kernel code.
# `/Brepro` makes the PE header timestamp deterministic: without it every run
# gives a different hash, and reproducibility is out of the question.
rustflags = ["-C", "target-feature=+crt-static", "-C", "panic=abort", "-C", "link-arg=/Brepro"]
