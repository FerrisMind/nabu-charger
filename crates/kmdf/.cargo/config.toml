# Драйвер режима ядра собирается ТОЛЬКО под ARM64: целевое устройство —
# планшет Xiaomi Pad 5 (nabu, Snapdragon 860) под Windows on ARM64.
# Хост-машина здесь amd64, поэтому без этого файла cargo по умолчанию собрал бы
# x86_64 и драйвер не загрузился бы на планшете.
[build]
target = "aarch64-pc-windows-msvc"
# Ядро линкуется со статическим CRT: это требование WDK, и `wdk-build`
# отказывается собирать драйвер без него (`Error: StaticCrtNotEnabled`).
# `panic=abort` — обязательный режим для кода ядра.
# `/Brepro` делает метку времени PE-заголовка детерминированной: без неё каждый
# прогон даёт другой хеш, и о воспроизводимости говорить нельзя.
rustflags = ["-C", "target-feature=+crt-static", "-C", "panic=abort", "-C", "link-arg=/Brepro"]
