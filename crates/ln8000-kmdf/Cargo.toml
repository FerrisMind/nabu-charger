[package]
name = "ln8000-kmdf"
description = "LN8000 charge pump KMDF driver for Xiaomi Pad 5: PEIC node (QCOM057E) over I2C via SpbCx"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-or-later"
publish = false

# The crate is excluded from the workspace: the build needs the WDK, LLVM/clang
# (bindgen) and cargo-wdk. The workspace's regular CI builds only the host part.
[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[package.metadata.wdk.driver-model]
driver-type = "KMDF"
kmdf-version-major = 1
target-kmdf-version-minor = 33

[dependencies]
ln8000 = { path = "../ln8000", default-features = false }
wdk = "0.4.1"
wdk-alloc = "0.4.1"
wdk-sys = { version = "0.5.1", features = ["spb"] }
paste = "1.0.15"

[build-dependencies]
wdk-build = "0.5.1"

[features]
default = []
nightly = ["wdk/nightly", "wdk-sys/nightly"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
