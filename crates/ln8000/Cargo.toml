[package]
name = "ln8000"
description = "LN8000 charge pump driver core (Xiaomi Pad 5, I2C 0x51): registers, modes, protections, status"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["driver", "charger", "ln8000", "i2c", "no-std"]
categories = ["hardware-support", "no-std", "embedded"]

[lib]
name = "ln8000"
path = "src/lib.rs"

[features]
# `testkit` is part of the default build: the documentation examples must
# compile and run under `cargo test`.
default = ["std", "testkit"]
std = []
testkit = []

[lints]
workspace = true

[dependencies]
