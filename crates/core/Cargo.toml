[package]
name = "charger-core"
description = "Transport-independent core of the Xiaomi Pad 5 (nabu) charging driver: adapter detection via APSD and input current policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["driver", "pmic", "charger", "spmi", "no-std"]
categories = ["hardware-support", "no-std", "embedded"]

[lib]
name = "charger_core"
doctest = false

[features]
# `testkit` is part of the default build so that the doc examples compile and run
# under `cargo test`. The kernel-mode driver pulls the crate with
# `default-features = false` and does not pull the mock.
default = ["std", "testkit"]
# `std` is used by the tests and host tools; the core builds without it.
std = []
# `testkit` adds the reference mock transport and the in-memory journal.
testkit = []

[lints]
workspace = true

[dependencies]
