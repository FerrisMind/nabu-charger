[workspace]
resolver = "3"
members = ["crates/core", "crates/host", "crates/cli"]
# Драйвер режима ядра подключается отдельно: ему нужен WDK и cargo-wdk,
# которых нет в обычном окружении CI. См. crates/kmdf/README.md
exclude = ["crates/kmdf"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/nabu-fastcharge"
publish = false

[workspace.dependencies]
core = { package = "charger-core", path = "crates/core", version = "0.1.0" }
host = { path = "crates/host", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "warn"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
doc_markdown = "warn"
module_name_repetitions = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
